; Chargé en dernier (zzz-) : surcharge le réglage par défaut de l'image
; (écoute sur toutes les interfaces) pour n'écouter qu'en local.
[www]
user = www-data
group = www-data
listen = 127.0.0.1:9000

; Les variables d'environnement Render (DATABASE_URL, APP_DEBUG,
; TRUST_PROXY...) doivent rester visibles de l'application.
clear_env = no

pm = dynamic
pm.max_children = 6
pm.start_servers = 2
pm.min_spare_servers = 1
pm.max_spare_servers = 3
pm.max_requests = 500
