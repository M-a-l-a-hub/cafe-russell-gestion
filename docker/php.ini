expose_php = Off
display_errors = Off
display_startup_errors = Off
log_errors = On

; L'application lit $_ENV (DATABASE_URL, APP_DEBUG, TRUST_PROXY...).
variables_order = "EGPCS"

memory_limit = 128M
post_max_size = 2M
max_execution_time = 30

opcache.enable = 1
opcache.validate_timestamps = 0
opcache.memory_consumption = 64
