<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Café Russell</title>
<link rel="manifest" href="/manifest.json">
<meta name="theme-color" content="#2B1B12">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Café Russell">
<link rel="icon" type="image/svg+xml" href="/icons/icon.svg">
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@600;700&family=Source+Serif+4:wght@400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/assets/app.css">
<style>
  /* Modale */
  .fond-modale { position: fixed; inset: 0; background: rgba(43,27,18,.45); display: flex; align-items: flex-end; justify-content: center; z-index: 20; }
  @media (min-width: 640px) { .fond-modale { align-items: center; } }
  .carte-modale { background: white; width: 100%; max-width: 480px; max-height: 88vh; overflow-y: auto; border-radius: 16px 16px 0 0; padding: 20px; }
  @media (min-width: 640px) { .carte-modale { border-radius: 16px; } }
  .entete-modale { display: flex; justify-content: space-between; align-items: center; margin-bottom: 14px; }
  .fermer-modale { background: none; border: none; font-size: 1.1rem; color: var(--brun-500); cursor: pointer; padding: 4px 8px; }
</style>
</head>
<body>

<section id="ecran-connexion" class="ecran-connexion">
  <div class="carte-connexion">
    <div class="tasse">
      <svg viewBox="0 0 24 24" width="34" height="34" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
        <path d="M4 8h13v5.5A5.5 5.5 0 0 1 11.5 19h-2A5.5 5.5 0 0 1 4 13.5V8Z"/>
        <path d="M17 9.5h1.2a2.3 2.3 0 0 1 0 4.6H17"/>
        <path d="M8 4c-.6.7-.6 1.3 0 2M11.3 4c-.6.7-.6 1.3 0 2"/>
      </svg>
    </div>
    <h1>Café Russell</h1>
    <p class="sous-titre">Connecte-toi pour gérer ta journée de vente.</p>
    <p class="message-erreur" id="erreur-connexion" hidden></p>
    <form id="form-connexion">
      <div class="champ">
        <label for="telephone">Téléphone</label>
        <input type="tel" id="telephone" name="telephone" autocomplete="username" required>
      </div>
      <div class="champ">
        <label for="mot_de_passe">Mot de passe</label>
        <input type="password" id="mot_de_passe" name="mot_de_passe" autocomplete="current-password" required>
      </div>
      <button class="principal" type="submit">Se connecter</button>
    </form>
  </div>
</section>

<div id="app" class="app">
  <div class="colonne-app">
    <header class="entete">
      <div class="entete-ligne">
        <div class="bloc-titre">
          <svg class="icone-entete" viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
            <path d="M4 8h13v5.5A5.5 5.5 0 0 1 11.5 19h-2A5.5 5.5 0 0 1 4 13.5V8Z"/>
            <path d="M17 9.5h1.2a2.3 2.3 0 0 1 0 4.6H17"/>
          </svg>
          <div class="bloc-texte">
            <div class="titre-site">Café Russell</div>
            <div class="qui" id="nom-utilisateur"></div>
          </div>
        </div>
        <div class="entete-actions" id="entete-actions">
          <button type="button" class="bouton-menu" id="bouton-menu" aria-label="Menu">
            <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
          </button>
        </div>
      </div>
      <select id="selecteur-site" hidden></select>
    </header>

    <main class="contenu">
      <section id="vue-accueil"></section>
      <section id="vue-ecarts" hidden></section>
      <section id="vue-anomalies" hidden></section>
      <section id="vue-vendeurs" hidden></section>
      <section id="vue-sacs" hidden></section>
      <section id="vue-argent" hidden></section>
      <section id="vue-tableau" hidden></section>
    </main>
  </div>

  <nav class="bas">
    <button data-vue="accueil" class="actif">
      <svg class="icone" viewBox="0 0 24 24" width="21" height="21" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
        <path d="M4 8h13v5.5A5.5 5.5 0 0 1 11.5 19h-2A5.5 5.5 0 0 1 4 13.5V8Z"/>
        <path d="M17 9.5h1.2a2.3 2.3 0 0 1 0 4.6H17"/>
      </svg>
      Journée
    </button>
    <button data-vue="ecarts">
      <svg class="icone" viewBox="0 0 24 24" width="21" height="21" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
        <path d="M12 3v18M7 7h10M5 7l-2 5a3 3 0 0 0 6 0l-2-5Zm14 0l-2 5a3 3 0 0 0 6 0l-2-5Z"/>
      </svg>
      Écarts
    </button>
    <button data-vue="anomalies">
      <svg class="icone" viewBox="0 0 24 24" width="21" height="21" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
        <path d="M3 8.5 12 4l9 4.5-9 4.5-9-4.5Z"/>
        <path d="M3 8.5V16l9 4.5 9-4.5V8.5M12 13v7.5"/>
      </svg>
      Stock
    </button>
    <button data-vue="vendeurs">
      <svg class="icone" viewBox="0 0 24 24" width="21" height="21" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="8" r="3.3"/>
        <path d="M5 20c.8-3.8 3.6-6 7-6s6.2 2.2 7 6"/>
      </svg>
      Vendeurs
    </button>
    <button data-vue="sacs">
      <svg class="icone" viewBox="0 0 24 24" width="21" height="21" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
        <path d="M8 8V6a4 4 0 0 1 8 0v2"/>
        <path d="M5.5 8h13l1 12.5a1.5 1.5 0 0 1-1.5 1.5H6a1.5 1.5 0 0 1-1.5-1.5L5.5 8Z"/>
      </svg>
      Sacs
    </button>
    <button data-vue="argent">
      <svg class="icone" viewBox="0 0 24 24" width="21" height="21" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="8.5"/>
        <path d="M12 7.5v9M9.5 9.7c0-1.2 1.1-2 2.5-2s2.5.7 2.5 1.8c0 2.4-5 1.5-5 3.8 0 1.1 1.1 1.8 2.5 1.8s2.5-.8 2.5-2"/>
      </svg>
      Argent
    </button>
    <button data-vue="tableau" data-russell-seulement>
      <svg class="icone" viewBox="0 0 24 24" width="21" height="21" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
        <rect x="3.5" y="3.5" width="7" height="7" rx="1"/>
        <rect x="13.5" y="3.5" width="7" height="7" rx="1"/>
        <rect x="3.5" y="13.5" width="7" height="7" rx="1"/>
        <rect x="13.5" y="13.5" width="7" height="7" rx="1"/>
      </svg>
      Tableau
    </button>
  </nav>
</div>

<div id="modale" hidden></div>

<script src="/assets/hors-ligne.js"></script>
<script src="/assets/app.js"></script>
</body>
</html>
